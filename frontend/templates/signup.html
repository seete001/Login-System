<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Bank - Sign Up</title> 
    <link rel="stylesheet" href="/frontend/static/style.css"> 
</head> 
<body> 
    <header class="site-header"> 
        <a href="/login" class="brand-link"> 
            <div class="brand-logo">B</div> 
            <span class="brand-name">Transaction Bank</span> 
        </a> 
        <button type="button" id="themeToggle" class="theme-toggle">
            Light Mode
        </button>
    </header> 
 
    <main class="card"> 
        <header> 
            <h1>Create Account</h1> 
            <p class="subtitle">Get started with your new bank account today.</p> 
        </header> 
 
         <!-- Form that user can create account --> 
         
        <!-- Full Name part --> 
         <form id="signupForm"> 

            <div class="form-group"> 
                <label for="fullName">Full Name</label> 
                <input  
                    type="text"  
                    id="fullName"  
                    name="fullName"  
                    placeholder="John"  
                    required  
                    autocomplete="name" 
                > 
            </div> 
            
            
 
            <!-- Email Part --> 
            <div class="form-group"> 
                <label for="email">Email Address</label> 
                <input  
                    type="email"  
                    id="email"  
                    name="email"  
                    placeholder="name@example.com"  
                    required  
                    autocomplete="email" 
                > 
            </div> 

            
            
 
            <!-- Password part --> 
            <div class="form-group"> 
                <label for="password">Password</label> 
                <div class="password-container">
                    <input  
                        type="password"  
                        id="password"  
                        name="password"  
                        placeholder="••••••••"  
                        required  
                        autocomplete="new-password" 
                    > 
                    <button type="button" class="password-toggle">
                        Show
                    </button>
                </div>
                <div id="passwordStrength" class="password-strength"></div>
            </div> 

            
            <div class="form-group"> 
                <label for="password">Reenter Password</label> 
                <div class="password-container">
                    <input  
                        type="password"  
                        id="passwordR"  
                        name="passwordR"  
                        placeholder="••••••••"  
                        required  
                        autocomplete="new-password" 
                    > 
                    <button type="button" class="password-toggle">
                        Show
                    </button>
                </div>
            </div> 

            <p id="passwordError" class="form-error"></p>


            <!-- Button tu submit --> 
            <button type="submit" class="btn">Sign Up</button> 
            <div id="signupMessage" class="form-error"></div>
        </form> 
 
        <p class="footer-text"> 
            Already have an account?  
            <a href="/login">Log in</a> 
        </p> 
    </main> 
 
    <!-- Footer --> 
    <footer class="site-footer"> 
 
        <p>&copy; 2026 Transaction Bank. All rights reserved.</p> 
     
    </footer> 
 
    <script 
        type="module"
        src="/frontend/static/js/script.js">
    </script>

</body> 
</html>
